<!DOCTYPE html>
<html lang="en" dir="rtl">

    <title>login</title>
</head>

            <p id="login-error" style="color: red;"></p>

    </div>

    <script src="js/api.js" ></script>
    <script src="js/auth.js"></script>

</html>
